app:
  security:
    username: dev
    # BCrypt of "dev" — same as the development default.
    password-hash: $2b$10$CUM1.9K58CuNfH1N8F.1HepM9B7/N8WPWwBWj9mT0YI3O7yX4R6nq
  rate-limit:
    # High enough that functional tests are never throttled; the limiter has
    # its own unit test that drives the counter directly.
    max-submissions: 1000
    window: 1m
  videos-dir: ${java.io.tmpdir}/centroid-finder-test-videos
  results-dir: ${java.io.tmpdir}/centroid-finder-test-results
  video-processor-jar: ${java.io.tmpdir}/processor.jar
  job-timeout: 30s

spring:
  datasource:
    url: jdbc:h2:mem:centroidfinder;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
