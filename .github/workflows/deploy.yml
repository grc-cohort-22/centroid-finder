name: Deploy

# Manual trigger only. The AWS environment this deploys into (ECS cluster,
# service, ECR repository, RDS instance) has been torn down — the project is
# not kept running continuously, since an idle Fargate service plus RDS costs
# real money for a portfolio demo. Nothing here is stale or broken: the
# pipeline below is exactly what ran on every push while the environment
# existed, last succeeding 2026-06-18.
#
# To deploy again: `terraform apply` in terraform/environments/prod, set the
# ECS_CLUSTER / ECS_SERVICE / ECS_TASK_FAMILY / ECR_REPOSITORY repo variables
# from its outputs, then run this workflow from the Actions tab.
#
# Left on `push: main` it would fail on every commit — the ECR push step has
# no repository to push to — leaving a permanent red mark on the default
# branch for an entirely expected reason. See docs/IMPROVEMENT_SPEC.md.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # Reusable job graph (.github/workflows/_ci.yml) — unit + integration tests.
  # deploy-backend below waits on this one job name regardless of how many
  # checks it grows to contain, so a red test can never reach prod.
  ci:
    uses: ./.github/workflows/_ci.yml

  deploy-backend:
    name: Deploy Backend
    needs: ci
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # -DskipTests is safe here: the `ci` job above already ran the full
      # unit + integration suite against this same commit.
      - name: Build JARs
        run: mvn -B package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Render ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ vars.ECS_TASK_FAMILY }}
          container-name: centroid-finder
          image: ${{ env.IMAGE_URI }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
