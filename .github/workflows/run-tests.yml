# Fast feedback on push/PR. The actual job graph lives in _ci.yml so that
# deploy.yml can gate on the identical set of checks — see the `ci` job there.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/_ci.yml
